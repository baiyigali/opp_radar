[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opp-radar"
version = "1.0.1"
description = "Opportunity radar for indie devs: prompts and workflow to scout and write article-length opportunity notes. Generation only — rendering and publishing live in wechat-auto-publish."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "程序员白大力" },
]
keywords = ["indie-dev", "opportunity", "prompt", "developer", "radar", "content-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
]
# 本包只含提示词，不依赖渲染/发布库（它们在 wechat-auto-publish 里）
dependencies = []

[project.urls]
Homepage = "https://github.com/baiyigali/opp_radar"
Repository = "https://github.com/baiyigali/opp_radar"

[tool.setuptools]
packages = ["opp_radar"]

[tool.setuptools.package-data]
opp_radar = ["py.typed"]
